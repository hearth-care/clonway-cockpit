name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, synchronize, opened]
  merge_group:

# Cancel superseded runs on the same PR/branch. The latest commit is the
# only one that matters for merge eligibility.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'run-ci' ||
      contains(github.event.pull_request.labels.*.name, 'run-ci')
    uses: ./.github/workflows/reusable-ci.yml
    with:
      prod-import-package: clonway_cockpit

  gitleaks:
    name: Gitleaks PR diff
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks v8.21.2
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks

      - name: Scan PR diff for secrets
        run: gitleaks detect --no-banner --log-opts="origin/${{ github.base_ref }}..HEAD"

  docs:
    name: docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Build API docs
        run: make docs

      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/docs

      - name: Deploy Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
